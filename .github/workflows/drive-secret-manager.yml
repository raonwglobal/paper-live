name: Drive Secret Manager checks

on:
  pull_request:
    paths:
      - "tools/drive-secret-manager/**"
      - "src/paper_live/secrets/**"
      - ".github/workflows/drive-secret-manager.yml"
  push:
    branches: [main, "feat/drive-secret-manager-web"]
    paths:
      - "tools/drive-secret-manager/**"
      - "src/paper_live/secrets/**"
      - ".github/workflows/drive-secret-manager.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pip install -r tools/drive-secret-manager/requirements.txt
      - run: ruff check tools/drive-secret-manager/app.py
      - run: python -m compileall -q tools/drive-secret-manager
      - run: pytest -q
