name: Automated recommendation

on:
  workflow_run:
    workflows: ["Scheduled market data collection"]
    types: [completed]
  workflow_dispatch:
    inputs:
      decision_date:
        description: "Decision date (YYYY-MM-DD); defaults to yesterday UTC"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: automated-recommendation
  cancel-in-progress: false

jobs:
  recommend:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install recommendation runtime
        run: python -m pip install -e .

      - name: Resolve decision date
        id: params
        shell: bash
        env:
          INPUT_DATE: ${{ inputs.decision_date }}
        run: |
          set -euo pipefail
          decision_date="${INPUT_DATE:-$(date -u -d 'yesterday' +%F)}"
          python - "$decision_date" <<'PY'
          import sys
          from datetime import date
          date.fromisoformat(sys.argv[1])
          PY
          echo "decision_date=$decision_date" >> "$GITHUB_OUTPUT"

      - name: Build recommendations
        env:
          GOOGLE_DRIVE_DATA_ACCESS_TOKEN: ${{ secrets.GOOGLE_DRIVE_DATA_ACCESS_TOKEN }}
          GOOGLE_DRIVE_DATA_SHARED_DRIVE_ID: ${{ secrets.GOOGLE_DRIVE_DATA_SHARED_DRIVE_ID }}
          GOOGLE_DRIVE_DATA_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_DATA_FOLDER_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_DRIVE_DATA_ACCESS_TOKEN:-}" ]]; then
            echo "::error::GOOGLE_DRIVE_DATA_ACCESS_TOKEN secret is required for automated recommendations."
            exit 1
          fi
          mkdir -p reports
          paper-live-recommend \
            --storage drive \
            --dataset market/daily-prices \
            --decision-time "${{ steps.params.outputs.decision_date }}T23:59:59+00:00" \
            --output-json ./reports/recommendation-summary.json > ./reports/recommendation-output.json

      - name: Publish recommendation summary
        shell: bash
        env:
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = json.loads(Path("reports/recommendation-summary.json").read_text(encoding="utf-8"))
          selected = payload.get("selected", [])
          lines = [
              "## Automated recommendation",
              f"- Decision time: {payload['decision_time']}",
              f"- Input rows: {payload['input_rows']}",
              f"- Selected positions: {len(selected)}",
              f"- Recommendation dataset: {payload['recommendation_manifest']['dataset']}",
          ]
          for row in selected[:10]:
              lines.append(
                  f"- {row.get('market', '')} {row.get('symbol', '')}: "
                  f"score={row.get('score', 'n/a')}, weight={row.get('target_weight', 'n/a')}"
              )
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload recommendation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
